
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Box Model</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>CSS Playground</h1>

    <p>
      Vi lär oss hur CSS fungerar.
      Här finns en <a href="#">länk i texten</a>.
    </p>

    <section class="cards">
      <div class="card">
        <h2>Kort 1</h2>
        <p>Lite innehåll i en box.</p>
      </div>

      <div class="card">
        <h2>Kort 2</h2>
        <p>Lite mer innehåll i en box.</p>
      </div>

      <div class="card">
        <h2>Kort 3</h2>
        <p>Ytterligare ett kort.</p>
      </div>
    </section>

    <button type="button">En knapp</button>

    <section class="display-demo">
      <div class="block-demo">Första div</div>
      <div class="block-demo">Andra div</div>
      <div class="block-demo">Tredje div</div>
    </section>

    <section class="inline-demo">
      <span>Första span</span>
      <span>Andra span</span>
      <span>Tredje span</span>
    </section>

  </main>
</body>
</html>
