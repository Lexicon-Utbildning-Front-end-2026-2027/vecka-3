
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model – Övning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>CSS Box Model – Övning</h1>

    <section class="container">
      <article class="card">
        <h2>Första kortet</h2>
        <p>
          Det här är ett kort med lite text.
          Vi vill ha luft runt innehållet.
        </p>
        <a href="#" class="button">Läs mer</a>
      </article>

      <article class="card">
        <h2>Andra kortet</h2>
        <p>
          Här finns ytterligare ett kort.
          Det ska ha samma utseende som det första.
        </p>
        <a href="#" class="button">Läs mer</a>
      </article>
    </section>
  </main>
</body>
</html>
